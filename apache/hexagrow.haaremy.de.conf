# hexagrow.haaremy.de -- statisches Unity-WebGL-Spiel
# Deploy-Ziel: LXC 124 (Reverse Proxy), Files unter /var/www/hexagrow.haaremy.de
# Cloudflare-Wildcard *.haaremy.de -> 37.120.114.157 -> DNAT auf LXC 124.

<VirtualHost *:80>
    ServerName hexagrow.haaremy.de
    Redirect permanent / https://hexagrow.haaremy.de/
    ErrorLog ${APACHE_LOG_DIR}/hexagrow-error.log
    CustomLog ${APACHE_LOG_DIR}/hexagrow-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName hexagrow.haaremy.de
    DocumentRoot /var/www/hexagrow.haaremy.de

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/hexagrow.haaremy.de/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hexagrow.haaremy.de/privkey.pem

    <Directory /var/www/hexagrow.haaremy.de>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # MIME-Types fuer Unity-WebGL -- sonst verweigert der Browser streaming-compile
    AddType application/wasm .wasm
    AddType application/octet-stream .data
    AddType application/javascript .js

    <FilesMatch "\.(wasm|data)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Security-Header
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/hexagrow-error.log
    CustomLog ${APACHE_LOG_DIR}/hexagrow-access.log combined
</VirtualHost>
