# hexagrow.haaremy.de -- statisches Unity-WebGL-Spiel
# Deploy-Ziel: LXC 124, DocumentRoot /var/www/hexagrow.haaremy.de
# Wildcard-Cert: /etc/letsencrypt/live/haaremy-wildcard/

<VirtualHost *:80>
    ServerName hexagrow.haaremy.de
    RewriteEngine On
    RewriteRule ^(.*)$ https://hexagrow.haaremy.de$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName hexagrow.haaremy.de
    DocumentRoot /var/www/hexagrow.haaremy.de

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/haaremy-wildcard/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/haaremy-wildcard/privkey.pem

    <Directory /var/www/hexagrow.haaremy.de>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # MIME-Types fuer Unity-WebGL -- Browser braucht application/wasm fuer streaming-compile
    AddType application/wasm .wasm
    AddType application/octet-stream .data

    <FilesMatch "\.(wasm|data)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(js|css|png|ico)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # Security-Header
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self' *.haaremy.de"

    ErrorLog ${APACHE_LOG_DIR}/hexagrow-error.log
    CustomLog ${APACHE_LOG_DIR}/hexagrow-access.log combined
</VirtualHost>
